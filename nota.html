<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nota — Lore</title>
<meta name="description" content="Una nota dal quaderno di laboratorio di Lore.">
<meta property="og:title" content="Lore — Quaderno di laboratorio">
<meta property="og:description" content="Imparo come funzionano le macchine che imparano.">
<meta property="og:type" content="article">
<meta property="og:locale" content="it_IT">
<meta name="theme-color" content="#1A1918">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('lab-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="page">
<header class="masthead">
  <a class="brand" href="index.html">Lore</a>
  <div class="masthead-right">
    <nav class="nav" aria-label="Navigazione"><a href="index.html#note">← Tutte le note</a></nav>
    <button type="button" class="pill-btn theme-toggle" aria-label="Passa al tema chiaro">
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="label">Scuro</span>
    </button>
  </div>
</header>

<main style="display: contents">
<article class="article" id="article" aria-live="polite">
  <p class="loading">Carico la nota…</p>
</article>

<section class="comments" id="comments" aria-labelledby="comments-title" hidden>
  <div class="comments-head">
    <h2 id="comments-title">Commenti</h2>
    <span class="sans muted" style="font-size: 14px" id="comments-count"></span>
  </div>
  <div id="comments-list"></div>
  <p class="notice" id="comments-off" hidden>I commenti si attivano appena il sito viene collegato al database.</p>
  <form class="form-card" id="comment-form" hidden novalidate>
    <label for="c-name">Nome</label>
    <input class="input" id="c-name" name="name" type="text" maxlength="60" autocomplete="name" placeholder="Come ti chiami?" required>
    <label for="c-body">Commento</label>
    <textarea class="textarea" id="c-body" name="body" rows="4" maxlength="2000" placeholder="Un’idea, una correzione, una domanda…" required></textarea>
    <div class="hp" aria-hidden="true"><label for="c-site">Sito</label><input id="c-site" name="site" type="text" tabindex="-1" autocomplete="off"></div>
    <div class="form-foot">
      <span class="form-note" id="c-note">I commenti sono visibili a tutti.</span>
      <button type="submit" class="pill-btn primary" id="c-send">Pubblica commento</button>
    </div>
  </form>
</section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <span>Lore · Torino · 2026</span>
    <nav aria-label="Navigazione"><a href="index.html">Torna al quaderno</a></nav>
  </div>
</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/nota.js"></script>
</body>
</html>
